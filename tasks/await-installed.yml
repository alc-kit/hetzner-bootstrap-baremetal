---
# After installimage's reboot, the host comes up on the same IP but with
# fresh SSH host keys.  Re-fingerprint and re-gather facts so subsequent
# roles run against accurate inventory data.

- name: "Drop rescue host key from local known_hosts"
  ansible.builtin.known_hosts:
    name: "{{ ansible_host | default(inventory_hostname) }}"
    state: absent
  delegate_to: localhost
  become: false

- name: "Reset gathered facts (the rescue's facts are now stale)"
  ansible.builtin.meta: clear_facts

- name: "Wait for the installed system's SSH"
  ansible.builtin.wait_for_connection:
    delay: 30
    sleep: 10
    timeout: "{{ hetzner_bootstrap_installed_wait_seconds }}"

- name: "Re-gather facts on the installed system"
  ansible.builtin.setup:

- name: "Confirm we are no longer in the rescue"
  ansible.builtin.assert:
    that:
      - "'rescue' not in (ansible_facts.kernel | lower)"
      - ansible_facts.distribution | lower == 'debian'
    fail_msg: >-
      Post-reboot host does not look like installed Debian
      (kernel={{ ansible_facts.kernel }}, distro={{ ansible_facts.distribution }}).
      installimage may have failed silently or the wrong image was selected.

- name: "Assert the installed Debian release matches the requested codename"
  # The image name matched, but did it install the release we asked for?  A
  # mislabeled tarball or an untrustworthy '-latest-' symlink can install the
  # WRONG release (e.g. bookworm when trixie was intended).  ABORT here rather
  # than hand a wrong-release host to downstream roles — never silently proceed.
  ansible.builtin.assert:
    that:
      - (ansible_facts.distribution_release | lower) == (hetzner_bootstrap_image_codename | lower)
    fail_msg: >-
      Installed Debian release is '{{ ansible_facts.distribution_release }}' but
      hetzner_bootstrap_image_codename requested '{{ hetzner_bootstrap_image_codename }}'
      (image used: {{ hetzner_bootstrap_image }}).  The rescue image did not
      install the expected release.  Refusing to continue — fix the image
      selection and re-provision before running any downstream role.
    success_msg: >-
      Installed release '{{ ansible_facts.distribution_release }}' matches the
      requested codename.
  when: hetzner_bootstrap_verify_installed_codename | default(true) | bool

- name: "Summary"
  ansible.builtin.debug:
    msg: |
      Bootstrap complete.
        Hostname:     {{ ansible_facts.hostname }}
        Distribution: {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}
        Kernel:       {{ ansible_facts.kernel }}
        OS disks:     {{ installimage_os_disks | default(installimage_os_disk_serials) | default('(see host_vars)') }}
        Data disks:   {{ hetzner_bootstrap_data_disks | default([]) }}
      Ready for downstream configuration roles.
