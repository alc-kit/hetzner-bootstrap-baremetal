---
# Activate Hetzner rescue mode for the target server, hardware-reset it, and
# wait until the rescue system answers SSH.
#
# Idempotency: community.hrobot.boot is safe to call repeatedly — it returns
# changed=false if the rescue is already configured for this key.  The reset,
# by nature, is NOT idempotent — we guard it with a check on the running
# system below.

- name: "Query current boot config"
  community.hrobot.server_info:
    hetzner_user: "{{ hetzner_robot_user }}"
    hetzner_password: "{{ hetzner_robot_password }}"
    server_number: "{{ hetzner_server_number }}"
  register: _server_info
  delegate_to: localhost
  no_log: true
  become: false

- name: "Probe whether the host already answers SSH on port 22"
  ansible.builtin.wait_for:
    host: "{{ ansible_host | default(inventory_hostname) }}"
    port: 22
    timeout: 10
    state: started
  register: _installed_probe
  failed_when: false
  changed_when: false
  delegate_to: localhost
  become: false

- name: "Record whether the host is currently responding"
  ansible.builtin.set_fact:
    _host_responds: "{{ _installed_probe.state | default('') == 'started' }}"

# A bare open port does not tell rescue from installed.  When the host responds,
# connect and read its kernel/distro so we can: (a) re-use an existing rescue
# session instead of bailing, and (b) still refuse to wipe a live installed OS.
- name: "Identify a responding host (rescue vs installed)"
  when: _host_responds | bool
  block:
    - name: "Drop any stale host key before identifying"
      ansible.builtin.known_hosts:
        name: "{{ ansible_host | default(inventory_hostname) }}"
        state: absent
      delegate_to: localhost
      become: false

    - name: "Gather kernel/distribution from the responding host"
      # ignore_unreachable so a host with :22 open but not authenticable (e.g. a
      # foreign OS that does not accept our key) degrades to "kernel undefined ->
      # not rescue -> bail" rather than aborting the play with an unreachable error.
      ansible.builtin.setup:
        gather_subset:
          - kernel
          - distribution
      failed_when: false
      ignore_unreachable: true

- name: "Classify whether the responding host is the rescue system"
  # Gathered (NOT inventory) facts: the identify `setup` above ran `hostname`/
  # `uname -n` ON the box. The current Hetzner rescue is Debian-based with a custom
  # kernel and reports hostname 'rescue' (older/Arch-based rescues matched on
  # kernel/distro — kept as fallback OR terms). NB: installimage is NOT a usable
  # marker — it is absent from a non-interactive shell's PATH. Only ever OR-in
  # *positive* rescue signals here; never loosen toward something an installed host
  # could match (wipe gate). If the gather failed, these are undefined → '' → false.
  ansible.builtin.set_fact:
    _in_rescue: "{{ _host_responds | bool
                    and ('rescue' in (ansible_facts.kernel | default('') | lower)
                         or (ansible_facts.distribution | default('') | lower) in ['archlinux', 'rescue']
                         or (ansible_facts.hostname | default('') | lower == 'rescue')
                         or (ansible_facts.nodename | default('') | lower == 'rescue')) }}"

- name: "Bail out if an INSTALLED system is up and force is not set"
  ansible.builtin.fail:
    msg: >-
      Host {{ ansible_host | default(inventory_hostname) }} appears to run an
      installed system (hostname={{ ansible_facts.hostname | default('?') }},
      kernel={{ ansible_facts.kernel | default('?') }},
      distro={{ ansible_facts.distribution | default('?') }}).  Refusing to reinstall.
      Set hetzner_bootstrap_force_reinstall: true to override.
  when:
    - _host_responds | bool
    - not _in_rescue | bool
    - not hetzner_bootstrap_force_reinstall | bool

- name: "Boot into rescue and hardware-reset"
  # Skipped when the host is ALREADY in rescue (and not forced): we re-use the
  # running rescue session (which also keeps device names identical to a prior
  # discovery run).  community.hrobot.boot is idempotent; the reset is not — hence
  # the guard.  A forced run always re-boots into a clean rescue.
  when: (not _in_rescue | bool) or (hetzner_bootstrap_force_reinstall | bool)
  block:
    - name: "Activate rescue mode in Robot"
      community.hrobot.boot:
        hetzner_user: "{{ hetzner_robot_user }}"
        hetzner_password: "{{ hetzner_robot_password }}"
        server_number: "{{ hetzner_server_number }}"
        rescue:
          os: linux
          authorized_keys:
            - "{{ hetzner_bootstrap_ssh_key_fingerprint }}"
      delegate_to: localhost
      no_log: true
      become: false

    - name: "Resolve the reset type to use for this run"
      ansible.builtin.set_fact:
        _reset_type: >-
          {{ hetzner_bootstrap_reset_type_when_down
             if ((not _host_responds | bool)
                 and (hetzner_bootstrap_reset_type_when_down | default('') | length > 0))
             else hetzner_bootstrap_reset_type }}

    - name: "Warn that a RESTART press does nothing on a powered-off server"
      # Costs one line of output and saves a silent
      # hetzner_bootstrap_rescue_wait_seconds-long wait that changes nothing.
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} did not answer SSH before the reset and reset_type is
          '{{ _reset_type }}'. 'hardware' presses the RESTART button, which is a NO-OP on a
          server that is powered OFF: the wait below would then time out after
          {{ hetzner_bootstrap_rescue_wait_seconds }}s having changed nothing. If this
          server is powered off, interrupt now and either power it on in Robot or re-run
          with -e hetzner_bootstrap_reset_type_when_down=power. ('power' presses the POWER
          button — it switches an OFF server ON, but on a RUNNING server it triggers a
          graceful SHUTDOWN, which is why the role will not choose it for you.)
      when:
        - not _host_responds | bool
        - _reset_type == 'hardware'

    - name: "Reset the server to boot into rescue (type: {{ _reset_type }})"
      community.hrobot.reset:
        hetzner_user: "{{ hetzner_robot_user }}"
        hetzner_password: "{{ hetzner_robot_password }}"
        server_number: "{{ hetzner_server_number }}"
        reset_type: "{{ _reset_type }}"
      delegate_to: localhost
      no_log: true
      become: false

    # After the reset the host gets a fresh, unknown SSH key.  Drop any prior
    # fingerprint from local known_hosts so the next connection negotiates anew.
    # StrictHostKeyChecking=accept-new is set in ansible_ssh_common_args
    # (recommended override in the consuming inventory).
    - name: "Clear stale host key from local known_hosts"
      ansible.builtin.known_hosts:
        name: "{{ ansible_host | default(inventory_hostname) }}"
        state: absent
      delegate_to: localhost
      become: false

    - name: "Wait for rescue SSH, and diagnose it if it never comes up"
      block:
        - name: "Wait for rescue SSH to respond"
          ansible.builtin.wait_for_connection:
            delay: 45
            sleep: 10
            timeout: "{{ hetzner_bootstrap_rescue_wait_seconds }}"
      rescue:
        - name: "Explain the rescue-boot timeout instead of leaving a bare ping failure"
          ansible.builtin.fail:
            msg: >-
              Rescue SSH never answered on {{ ansible_host | default(inventory_hostname) }}
              within {{ hetzner_bootstrap_rescue_wait_seconds }}s after a
              '{{ _reset_type }}' reset.
              {% if not _host_responds | bool %}
              The host was ALREADY not answering before the reset. If it is powered OFF,
              '{{ _reset_type }}' was a no-op: 'hardware' presses RESTART, which does nothing
              on an off server. Power it on in Robot, or re-run with
              -e hetzner_bootstrap_reset_type_when_down=power.
              {% endif %}
              A timeout here is NOT a reason to raise
              hetzner_bootstrap_rescue_wait_seconds — that only helps a server which is slow
              rather than stuck. Check, in order: (1) that another server on the same public
              path answers port 22, to rule out your own egress; (2) Robot, for whether
              rescue is still active/UNCONSUMED — if it is, the server never booted the
              rescue image at all, which separates 'stuck in POST' from 'booted but no
              network'; (3) the remote console, which is the only thing that shows where a
              dark server stopped; (4) escalate the reset type ('power', then 'manual'), and
              open a Robot support request if it stays dark for more than ~15 minutes after
              an accepted reset.

    - name: "Gather facts (rescue identifies via hostname 'rescue'; Debian-based, custom kernel)"
      ansible.builtin.setup:
        gather_subset:
          - kernel
          - distribution

- name: "Sanity-check we are actually in the rescue, not the installed OS"
  ansible.builtin.assert:
    that:
      - "'rescue' in (ansible_facts.kernel | default('') | lower)
         or (ansible_facts.distribution | default('') | lower) in ['archlinux', 'rescue']
         or (ansible_facts.hostname | default('') | lower == 'rescue')
         or (ansible_facts.nodename | default('') | lower == 'rescue')"
    fail_msg: >-
      Connected host does not look like the Hetzner rescue system
      (hostname={{ ansible_facts.hostname | default('?') }},
      kernel={{ ansible_facts.kernel | default('?') }},
      distro={{ ansible_facts.distribution | default('?') }}).
      Aborting to avoid wiping a live system.
