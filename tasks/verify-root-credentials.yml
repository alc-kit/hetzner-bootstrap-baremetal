---
# Independently PROVE both root auth methods from the controller, so a later
# accidental removal of one still leaves a usable break-glass fallback.  Each
# probe forces a SINGLE auth method (the other is disabled on the command line),
# so a pass genuinely exercises that method — not a fallback to the other.
#
# Key probe:      always runs; FAILS the play if pubkey login does not work.
# Password probe: runs when a password was set AND we can actually test it
#                 (plaintext password + `sshpass` on the controller); otherwise
#                 SKIPS with a warning rather than a false pass.

- name: "Verify | resolve probe target + private key"
  ansible.builtin.set_fact:
    _hbb_probe_host: "{{ hetzner_bootstrap_verify_ssh_host }}"
    _hbb_probe_key: "{{ hetzner_bootstrap_ssh_private_key_path }}"
    # A crypt hash ($6$…/$y$…) cannot be used to log in, so password auth is
    # only testable when a PLAINTEXT password was supplied.
    _hbb_pw_is_plaintext: "{{ hetzner_bootstrap_set_root_password | bool
                              and (hetzner_bootstrap_root_password | string | length > 0)
                              and not (hetzner_bootstrap_root_password | string).startswith('$') }}"

# ── Key auth (must pass) ─────────────────────────────────────────────────────
- name: "Verify | key auth — pubkey-only root login must succeed"
  ansible.builtin.command:
    argv:
      - ssh
      - -o
      - BatchMode=yes
      - -o
      - ConnectTimeout=15
      - -o
      - StrictHostKeyChecking=no
      - -o
      - UserKnownHostsFile=/dev/null
      - -o
      - PreferredAuthentications=publickey
      - -o
      - PasswordAuthentication=no
      - -o
      - IdentitiesOnly=yes
      - -i
      - "{{ _hbb_probe_key }}"
      - "root@{{ _hbb_probe_host }}"
      - "true"
  delegate_to: localhost
  become: false
  changed_when: false
  register: _hbb_key_probe
  failed_when: _hbb_key_probe.rc != 0

- name: "Verify | key auth OK"
  ansible.builtin.debug:
    msg: "PASS — root pubkey login works on {{ _hbb_probe_host }} (key: {{ _hbb_probe_key }})."

# ── Password auth (must pass when testable) ──────────────────────────────────
- name: "Verify | is sshpass available on the controller?"
  ansible.builtin.command: which sshpass
  delegate_to: localhost
  become: false
  changed_when: false
  failed_when: false
  register: _hbb_sshpass
  when: _hbb_pw_is_plaintext | bool

- name: "Verify | WARN — password auth NOT verified"
  ansible.builtin.debug:
    msg: >-
      Skipping password-auth verification (the password was still SET, just not
      proven from here). Reason:
      {{ 'a pre-hashed password was supplied, so the plaintext needed to log in is unknown'
         if not (_hbb_pw_is_plaintext | bool)
         else 'sshpass is not installed on the controller — install it to verify (e.g. dnf/apt install sshpass)' }}.
  when:
    - hetzner_bootstrap_set_root_password | bool
    - (not (_hbb_pw_is_plaintext | bool)) or ((_hbb_sshpass.rc | default(1)) != 0)

- name: "Verify | password auth — password-only root login must succeed"
  ansible.builtin.command:
    argv:
      - sshpass
      - -e
      - ssh
      - -o
      - ConnectTimeout=15
      - -o
      - StrictHostKeyChecking=no
      - -o
      - UserKnownHostsFile=/dev/null
      - -o
      - PreferredAuthentications=password
      - -o
      - PubkeyAuthentication=no
      - "root@{{ _hbb_probe_host }}"
      - "true"
  environment:
    SSHPASS: "{{ hetzner_bootstrap_root_password }}"
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true
  register: _hbb_pw_probe
  failed_when: _hbb_pw_probe.rc != 0
  when:
    - _hbb_pw_is_plaintext | bool
    - (_hbb_sshpass.rc | default(1)) == 0

- name: "Verify | password auth OK"
  ansible.builtin.debug:
    msg: "PASS — root password login works on {{ _hbb_probe_host }} (break-glass fallback confirmed)."
  when:
    - _hbb_pw_is_plaintext | bool
    - (_hbb_sshpass.rc | default(1)) == 0
