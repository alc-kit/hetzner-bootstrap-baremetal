---
# Guarantee BOTH root auth methods on the freshly-installed system:
#   1. SSH authorized_keys — installimage copies only the single rescue key;
#      we re-assert the full desired set so it is explicit and idempotent.
#   2. A root password      — a break-glass fallback (installimage sets none).
# and make sshd actually accept the password, so if one method is later removed
# the other still gets you in.  verify-root-credentials.yml then PROVES both.
#
# Runs on the installed system over the key-authenticated connection that
# await-installed established.  Ordered BEFORE verification so sshd is already
# reloaded when the password probe runs (a deferred handler would fire too late).

- name: "Credentials | assert a root password was supplied"
  ansible.builtin.assert:
    that:
      - hetzner_bootstrap_root_password is defined
      - hetzner_bootstrap_root_password | string | length > 0
    fail_msg: >-
      hetzner_bootstrap_set_root_password is true but
      hetzner_bootstrap_root_password is empty.  Supply a strong, vaulted
      password, or set hetzner_bootstrap_set_root_password: false.
  when: hetzner_bootstrap_set_root_password | bool

# ── SSH authorized_keys ──────────────────────────────────────────────────────
# Public keys are not secret (no no_log needed); label by index so key material
# never lands in task output regardless.
- name: "Credentials | authorise root SSH public keys (additive)"
  ansible.posix.authorized_key:
    user: root
    key: "{{ item }}"
    state: present
    exclusive: false
  loop: "{{ hetzner_bootstrap_root_authorized_keys }}"
  loop_control:
    index_var: _hbb_key_idx
    label: "root authorized_key #{{ _hbb_key_idx }}"
  when:
    - not (hetzner_bootstrap_root_authorized_keys_exclusive | bool)
    - hetzner_bootstrap_root_authorized_keys | length > 0

- name: "Credentials | enforce EXACT root authorized_keys set (exclusive)"
  # A single call with the whole set joined by newlines + exclusive:true replaces
  # the file atomically; looping with exclusive:true would leave only the LAST key.
  ansible.posix.authorized_key:
    user: root
    key: "{{ hetzner_bootstrap_root_authorized_keys | join('\n') }}"
    state: present
    exclusive: true
  when:
    - hetzner_bootstrap_root_authorized_keys_exclusive | bool
    - hetzner_bootstrap_root_authorized_keys | length > 0

# ── Root password ────────────────────────────────────────────────────────────
# Hash on the TARGET via chpasswd (part of Debian's `passwd` package) rather
# than the password_hash filter: that filter hashes on the CONTROLLER, which
# needs passlib on Python 3.13+ (the stdlib `crypt` module was removed).  chpasswd
# reads "user:secret" from stdin (never argv → not visible in `ps`); `-e` marks
# the secret as already-encrypted when a crypt hash ($6$…/$y$…) was supplied.
- name: "Credentials | set the root password"
  ansible.builtin.command:
    cmd: "chpasswd{{ ' -e' if (hetzner_bootstrap_root_password | string).startswith('$') else '' }}"
    stdin: "root:{{ hetzner_bootstrap_root_password }}"
  no_log: true
  changed_when: true
  when: hetzner_bootstrap_set_root_password | bool

# ── Permit root password login (so the password is a real fallback) ──────────
- name: "Credentials | permit root password login in sshd"
  when: hetzner_bootstrap_permit_root_password_login | bool
  block:
    - name: "Credentials | drop-in enabling PermitRootLogin + PasswordAuthentication"
      # Prefixed 00- so it sorts first among /etc/ssh/sshd_config.d/*.conf; sshd
      # uses the FIRST value seen for each option, so this wins over later drop-ins
      # (e.g. a cloud-init 50-*.conf) and the stock sshd_config.
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-hetzner-bootstrap-rootlogin.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by Ansible role: hetzner_bootstrap_baremetal — github.com/KvalitetsIT/hetzner-bootstrap-baremetal
          # Break-glass fallback: keep root password login usable if the SSH key
          # is ever removed.  Remove this file (and unset the password) to disable.
          PermitRootLogin yes
          PasswordAuthentication yes
      register: _hbb_sshd_dropin

    - name: "Credentials | validate the full sshd config"
      ansible.builtin.command: sshd -t
      changed_when: false

    # Must reload INLINE (not via a deferred handler): the very next phase
    # (verify-root-credentials.yml) opens a password login, which only works once
    # sshd has re-read this drop-in. The role is forward-only by design (see
    # handlers/main.yml).
    - name: "Credentials | reload sshd so the change takes effect"  # noqa: no-handler
      ansible.builtin.systemd:
        name: "{{ hetzner_bootstrap_sshd_service }}"
        state: reloaded
      when: _hbb_sshd_dropin is changed
