---
name: ansible-lint
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ansible-lint
        run: pip install ansible-lint ansible-core
      - name: Install collection deps
        run: ansible-galaxy collection install community.hrobot
      - name: Run ansible-lint
        run: ansible-lint
