---
# ============================================================================
# hetzner-bootstrap-baremetal role defaults
# ============================================================================
# Variables without a default value are REQUIRED and must be supplied via
# inventory (group_vars/host_vars).  Variables with a default are optional;
# the values below are sensible starting points but should be reviewed per
# customer/fleet.
# ============================================================================

# ----------------------------------------------------------------------------
# Hetzner Robot credentials  (REQUIRED — keep these vaulted)
# ----------------------------------------------------------------------------
# Generate a Webservice user in the Robot UI:
#   Settings -> Web service and app settings
# These vars are consumed by every community.hrobot.* call this role makes.
#
# hetzner_robot_user: ""
# hetzner_robot_password: ""

# ----------------------------------------------------------------------------
# Per-server identification  (REQUIRED — usually in host_vars)
# ----------------------------------------------------------------------------
# Numeric server ID shown in the Robot UI (NOT the IP, NOT the server name).
#
# hetzner_server_number: 0

# ----------------------------------------------------------------------------
# SSH key used to log into the rescue and the installed system
# ----------------------------------------------------------------------------
# The role:
#   1. Registers this key with Robot (idempotent) via community.hrobot.ssh_key
#   2. Tells community.hrobot.boot to authorize this key for the rescue
#   3. Includes it in the installimage config so the installed system also
#      accepts it for root login
#
# Override per-host or per-customer if you keep separate keys.
hetzner_bootstrap_ssh_public_key_path: "{{ lookup('env', 'HOME') }}/.ssh/id_ed25519.pub"

# Name used when registering the key with Robot (kept stable across runs).
hetzner_bootstrap_ssh_key_robot_name: "hetzner-bootstrap-{{ inventory_hostname }}"

# ----------------------------------------------------------------------------
# OS image selection  (intent-based; resolved from the rescue itself)
# ----------------------------------------------------------------------------
# installimage bases are tarballs shipped in the Hetzner rescue, named
# Debian-<NNNN>-<codename>-<arch>-<variant>.tar.<zst|gz>
# (e.g. Debian-1303-trixie-amd64-base.tar.zst).  There is NO Hetzner API that
# lists them — the Robot API returns only human-readable rescue-distro names —
# so the ONLY authoritative source is the rescue's own image directory.
#
# The role therefore resolves the concrete filename AT PROVISION TIME from that
# directory (tasks/resolve-image.yml), driven by the intent vars below: it picks
# the newest concrete point release matching {codename, arch, variant} and
# DELIBERATELY IGNORES the "-latest-" convenience symlink.  That symlink has been
# observed resolving to the WRONG release in the field (installing bookworm when
# trixie was intended), so it is not trusted.
#
# Set hetzner_bootstrap_image to a concrete filename ONLY to pin an exact image
# (auto-resolution is then skipped; validate-rescue still asserts it exists).
# Leave it EMPTY (default) to auto-resolve from the intent vars.
hetzner_bootstrap_image: ""

hetzner_bootstrap_image_codename: trixie
hetzner_bootstrap_image_arch: amd64
hetzner_bootstrap_image_variant: base

# After install, assert the booted release matches hetzner_bootstrap_image_codename
# (await-installed.yml), so a mislabeled/wrong image fails at PROVISION time rather
# than later in a downstream role.  Set false to skip (e.g. non-Debian images).
hetzner_bootstrap_verify_installed_codename: true

# Directory the rescue serves images from.  Shared by the installimage template
# (the IMAGE line) and the pre-flight existence check so they never drift.
# Resolves to Hetzner's IMAGESPATH (installimage's $SCRIPTPATH/../images/).
hetzner_bootstrap_images_dir: "/root/.oldroot/nfs/install/../images/"

# ----------------------------------------------------------------------------
# Disk selection  (REQUIRED — supply exactly ONE of the two vars below)
# ----------------------------------------------------------------------------
# Pick which disks installimage uses for the OS install.  Disks NOT selected
# are completely untouched and remain available for downstream roles (a data
# ZFS pool, a clevis-encrypted LUKS volume, etc.).
#
# RECOMMENDED — installimage_os_disk_serials: a list of disk SERIALS (or WWNs).
# Device names (sda, nvme0n1) can reorder across rescue reboots; serials/WWNs do
# not.  The role resolves each serial to the CURRENT device name in the rescue,
# in the same session that runs installimage, so the selection is stable.
# Order is preserved (drives DRIVE1, DRIVE2, ... numbering).
#
#   installimage_os_disk_serials: ["S6S1NE0R123456", "S6S1NE0R123457"]
#
# LEGACY — installimage_os_disks: raw device names (without /dev/).  Simple but
# fragile across reboots.  Mutually exclusive with installimage_os_disk_serials.
#
#   installimage_os_disks: [nvme0n1, nvme1n1]      # AX52 / AX102 NVMe pair
#   installimage_os_disks: [sda, sdb]              # legacy SATA SSDs
#   installimage_os_disks: [nvme0n1]               # single disk, no RAID
#
# Either way: run `--tags discover` (or the consuming repo's disk-discovery
# playbook) to dump serials/WWNs/sizes, then populate host_vars.
#
# installimage_os_disk_serials: []
# installimage_os_disks: []

# ----------------------------------------------------------------------------
# SWRAID — software RAID across the OS disks
# ----------------------------------------------------------------------------
# Set installimage_swraid: 0 to disable RAID (single-disk installs).
# Auto-disabled if only one OS disk is configured.
installimage_swraid: 1
installimage_swraid_level: 1   # 0|1|5|6|10  (only relevant when swraid=1)

# ----------------------------------------------------------------------------
# Partition layout
# ----------------------------------------------------------------------------
# Each entry becomes a PART line in the installimage config.
#   mount: target mount point or "swap" or "lvm"
#   fs:    filesystem: ext2|ext3|ext4|xfs|btrfs|swap|reiserfs
#   size:  M/G/T suffix, or "all" to consume remaining space
#
# Keep at least /, /boot, and swap.  LVM is supported by adding entries of the
# form { mount: lvm, fs: vg0, size: all }; see Hetzner's installimage docs for
# the exact LV/PV syntax.
#
# UEFI: modern Hetzner servers boot UEFI, which REQUIRES exactly one EFI System
# Partition (ESP) — `{ mount: "/boot/efi", fs: "esp", size: "256M" }` — or
# installimage aborts validation with "ESP missing or multiple ESP found"
# (after a wipe is already in motion).  It is included below by default;
# `tasks/validate-rescue.yml` fails fast if the rescue booted UEFI and no ESP is
# configured.  installimage mirrors the ESP across SWRAID members itself, so a
# single esp line is correct even with software RAID.  On a legacy-BIOS host the
# ESP is harmless (installimage only warns); drop it if you want a pure MBR
# layout there.
installimage_partitions:
  - { mount: "/boot/efi", fs: "esp", size: "256M" }
  - { mount: "/boot", fs: "ext4", size: "1G" }
  - { mount: "swap", fs: "swap", size: "32G" }
  - { mount: "/", fs: "ext4", size: "all" }

# ----------------------------------------------------------------------------
# Hostname & bootloader
# ----------------------------------------------------------------------------
installimage_hostname: "{{ inventory_hostname_short | default(inventory_hostname) }}"
installimage_bootloader: grub

# Path the rendered installimage config is written to in the rescue, then passed
# to `installimage -c`.  It MUST NOT be /autosetup: installimage's `-c` handler
# copies the file to /autosetup itself (get_options.sh), so pointing -c at
# /autosetup makes it `cp /autosetup /autosetup` → "are the same file" → the
# installer cancels.  Any other path is fine.
hetzner_bootstrap_installimage_config_path: "/root/installimage.conf"

# ----------------------------------------------------------------------------
# Optional: a post-install script that installimage runs after the new system
# is laid down (chrooted into the installed root).  Absolute path on the
# rescue filesystem.  Leave undefined to skip.
# ----------------------------------------------------------------------------
# installimage_post_install_script: /tmp/post-install.sh

# ----------------------------------------------------------------------------
# Behavior flags
# ----------------------------------------------------------------------------
# If true, run installimage even when the host appears to already be
# installed (i.e., responds on SSH with a non-rescue kernel).  Use only when
# intentionally wiping a server.
hetzner_bootstrap_force_reinstall: false

# Before installimage runs, stop any software RAID (mdadm) the rescue
# auto-assembled on the SELECTED OS disks and clear their RAID + partition
# signatures (tasks/prepare-os-disks.yml).  Prevents the common reinstall
# failures where the target disks are held open by an assembled array, or a
# leftover superblock causes the new array to re-absorb a stale member.  Only
# installimage_os_disks are touched; data disks are never referenced.
hetzner_bootstrap_wipe_os_disks_before_install: true

# Reset type sent to the Robot API to reboot into rescue.
# Options: "hardware" (recommended), "power", "manual", "software".
hetzner_bootstrap_reset_type: hardware

# ----------------------------------------------------------------------------
# Timeouts (seconds)
# ----------------------------------------------------------------------------
hetzner_bootstrap_rescue_wait_seconds: 600
hetzner_bootstrap_installimage_timeout_seconds: 1800
hetzner_bootstrap_installed_wait_seconds: 600

# ----------------------------------------------------------------------------
# Root credentials on the INSTALLED system  (set + verified)
# ----------------------------------------------------------------------------
# installimage only copies ONE SSH key (the rescue key) into the new system and
# sets NO root password — so root access hangs on that single key.  If it is
# ever removed the host is unreachable with no fallback (exactly the lock-out
# this block prevents).  When enabled, the role — over the key-authenticated
# connection await-installed just established — guarantees BOTH auth methods and
# then PROVES each one from the controller (verify-root-credentials.yml), so a
# later accidental removal of one still leaves a working break-glass fallback.
#
# The role's contract is "both methods work at hand-off"; keeping them working
# for the host's whole life is a fleet-config concern (a later hardening role
# that rewrites sshd_config must preserve the drop-in below to keep the password
# fallback).  See README "Root credentials".
hetzner_bootstrap_manage_root_credentials: true

# Private key matching hetzner_bootstrap_ssh_public_key_path — used ONLY by the
# post-install key-auth probe (verify-root-credentials.yml).  Defaults to the
# public key path with the trailing ".pub" stripped.
hetzner_bootstrap_ssh_private_key_path: "{{ hetzner_bootstrap_ssh_public_key_path | regex_replace('\\.pub$', '') }}"

# SSH public keys authorised for root on the installed system.  Defaults to the
# provisioning key (registered with Robot in prepare-ssh-key.yml); append
# operator / break-glass keys here for redundancy.
hetzner_bootstrap_root_authorized_keys:
  - "{{ hetzner_bootstrap_ssh_public_key }}"

# When true, root's authorized_keys is REPLACED with exactly the list above
# (any other key is removed).  Default false: additive — installimage's copied
# key and any pre-existing keys are kept.
hetzner_bootstrap_root_authorized_keys_exclusive: false

# Break-glass root password.  REQUIRED (non-empty) when
# hetzner_bootstrap_set_root_password is true — supply it VAULTED.  A plaintext
# value is hashed (sha512) before it touches the host; a value that already
# looks like a crypt hash ("$6$...") is used verbatim (but password auth then
# cannot be verified — see below).
hetzner_bootstrap_set_root_password: true
hetzner_bootstrap_root_password: ""

# Permit root password login in sshd so the password is a genuine fallback.
# Writes /etc/ssh/sshd_config.d/00-hetzner-bootstrap-rootlogin.conf (sorts
# first → wins over later drop-ins and the stock config).
# SECURITY: this enables PermitRootLogin yes + PasswordAuthentication yes.
# These hosts are managed over the internal VLAN/VPN; use a strong vaulted
# password.  Set false to leave sshd untouched (password set but only usable
# where password auth is already permitted, e.g. the Robot KVM console).
hetzner_bootstrap_permit_root_password_login: true

# systemd unit name for the SSH daemon on the installed system (Debian: "ssh").
hetzner_bootstrap_sshd_service: ssh

# After setting credentials, verify BOTH methods from the controller and FAIL
# if either does not authenticate.  Password verification needs `sshpass` on
# the controller AND a plaintext hetzner_bootstrap_root_password; when either is
# missing the password probe is SKIPPED with a warning (key probe still runs).
hetzner_bootstrap_verify_root_credentials: true

# Address the controller probes during verification.  Defaults to the address
# Ansible is already using for this host (the public IP during provisioning,
# when use_public is set in the consuming inventory).
hetzner_bootstrap_verify_ssh_host: "{{ ansible_host | default(inventory_hostname) }}"
