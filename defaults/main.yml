---
# ============================================================================
# hetzner-bootstrap-baremetal role defaults
# ============================================================================
# Variables without a default value are REQUIRED and must be supplied via
# inventory (group_vars/host_vars).  Variables with a default are optional;
# the values below are sensible starting points but should be reviewed per
# customer/fleet.
# ============================================================================

# ----------------------------------------------------------------------------
# Hetzner Robot credentials  (REQUIRED — keep these vaulted)
# ----------------------------------------------------------------------------
# Generate a Webservice user in the Robot UI:
#   Settings -> Web service and app settings
# These vars are consumed by every community.hrobot.* call this role makes.
#
# hetzner_robot_user: ""
# hetzner_robot_password: ""

# ----------------------------------------------------------------------------
# Per-server identification  (REQUIRED — usually in host_vars)
# ----------------------------------------------------------------------------
# Numeric server ID shown in the Robot UI (NOT the IP, NOT the server name).
#
# hetzner_server_number: 0

# ----------------------------------------------------------------------------
# SSH key used to log into the rescue and the installed system
# ----------------------------------------------------------------------------
# The role:
#   1. Registers this key with Robot (idempotent) via community.hrobot.ssh_key
#   2. Tells community.hrobot.boot to authorize this key for the rescue
#   3. Includes it in the installimage config so the installed system also
#      accepts it for root login
#
# Override per-host or per-customer if you keep separate keys.
hetzner_bootstrap_ssh_public_key_path: "{{ lookup('env', 'HOME') }}/.ssh/id_ed25519.pub"

# Name used when registering the key with Robot (kept stable across runs).
hetzner_bootstrap_ssh_key_robot_name: "hetzner-bootstrap-{{ inventory_hostname }}"

# ----------------------------------------------------------------------------
# OS image selection
# ----------------------------------------------------------------------------
# The image is a tarball that ships with the Hetzner rescue system.  Modern
# rescue images use the naming  Debian-<NNNN>-<codename>-<arch>-<variant>.tar.<zst|gz>
# (e.g. Debian-1303-trixie-amd64-base.tar.zst); the older
# "Debian-1300-trixie-64-minimal.tar.gz" style no longer exists.  A "-latest-"
# symlink (Debian-trixie-latest-amd64-base.tar.zst) tracks the newest point
# release.
#
# Browse what THIS rescue actually has:
#   ls /root/.oldroot/nfs/images/        (or the dir below, hetzner_bootstrap_images_dir)
#
# This DEFAULT tracks the newest trixie point release via the "-latest-" symlink
# — a robust, generic value for the role: it does not 404 as Hetzner rolls point
# releases (a stale pinned NAME is exactly what bit us once).  Consumers that
# need reproducibility should PIN a specific point release in their own inventory
# (group_vars/host_vars), e.g. the proxmox-install repo pins
# `Debian-1303-trixie-amd64-base.tar.zst` on its provisioning group because
# Proxmox builds depend on a known-good Debian.  Either way,
# `tasks/validate-rescue.yml` asserts the chosen image exists in the rescue
# BEFORE installimage runs (installimage does not check existence up front, so a
# stale/renamed name otherwise fails late, mid-install) — `find -L` so a
# "-latest-" symlink resolves; the check lists what IS available on a miss.
#
# FUTURE: hetzner-bootstrap-baremetal can serve installation types beyond
# Proxmox-on-Debian.  Supporting operator-supplied custom images (uploaded into
# the rescue, then referenced here) is a planned development path; not yet
# implemented.
hetzner_bootstrap_image: "Debian-trixie-latest-amd64-base.tar.zst"

# Directory the rescue serves images from.  Shared by the installimage template
# (the IMAGE line) and the pre-flight existence check so they never drift.
# Resolves to Hetzner's IMAGESPATH (installimage's $SCRIPTPATH/../images/).
hetzner_bootstrap_images_dir: "/root/.oldroot/nfs/install/../images/"

# ----------------------------------------------------------------------------
# Disk selection  (REQUIRED — supply exactly ONE of the two vars below)
# ----------------------------------------------------------------------------
# Pick which disks installimage uses for the OS install.  Disks NOT selected
# are completely untouched and remain available for downstream roles (a data
# ZFS pool, a clevis-encrypted LUKS volume, etc.).
#
# RECOMMENDED — installimage_os_disk_serials: a list of disk SERIALS (or WWNs).
# Device names (sda, nvme0n1) can reorder across rescue reboots; serials/WWNs do
# not.  The role resolves each serial to the CURRENT device name in the rescue,
# in the same session that runs installimage, so the selection is stable.
# Order is preserved (drives DRIVE1, DRIVE2, ... numbering).
#
#   installimage_os_disk_serials: ["S6S1NE0R123456", "S6S1NE0R123457"]
#
# LEGACY — installimage_os_disks: raw device names (without /dev/).  Simple but
# fragile across reboots.  Mutually exclusive with installimage_os_disk_serials.
#
#   installimage_os_disks: [nvme0n1, nvme1n1]      # AX52 / AX102 NVMe pair
#   installimage_os_disks: [sda, sdb]              # legacy SATA SSDs
#   installimage_os_disks: [nvme0n1]               # single disk, no RAID
#
# Either way: run `--tags discover` (or the consuming repo's disk-discovery
# playbook) to dump serials/WWNs/sizes, then populate host_vars.
#
# installimage_os_disk_serials: []
# installimage_os_disks: []

# ----------------------------------------------------------------------------
# SWRAID — software RAID across the OS disks
# ----------------------------------------------------------------------------
# Set installimage_swraid: 0 to disable RAID (single-disk installs).
# Auto-disabled if only one OS disk is configured.
installimage_swraid: 1
installimage_swraid_level: 1   # 0|1|5|6|10  (only relevant when swraid=1)

# ----------------------------------------------------------------------------
# Partition layout
# ----------------------------------------------------------------------------
# Each entry becomes a PART line in the installimage config.
#   mount: target mount point or "swap" or "lvm"
#   fs:    filesystem: ext2|ext3|ext4|xfs|btrfs|swap|reiserfs
#   size:  M/G/T suffix, or "all" to consume remaining space
#
# Keep at least /, /boot, and swap.  LVM is supported by adding entries of the
# form { mount: lvm, fs: vg0, size: all }; see Hetzner's installimage docs for
# the exact LV/PV syntax.
#
# UEFI: modern Hetzner servers boot UEFI, which REQUIRES exactly one EFI System
# Partition (ESP) — `{ mount: "/boot/efi", fs: "esp", size: "256M" }` — or
# installimage aborts validation with "ESP missing or multiple ESP found"
# (after a wipe is already in motion).  It is included below by default;
# `tasks/validate-rescue.yml` fails fast if the rescue booted UEFI and no ESP is
# configured.  installimage mirrors the ESP across SWRAID members itself, so a
# single esp line is correct even with software RAID.  On a legacy-BIOS host the
# ESP is harmless (installimage only warns); drop it if you want a pure MBR
# layout there.
installimage_partitions:
  - { mount: "/boot/efi", fs: "esp", size: "256M" }
  - { mount: "/boot", fs: "ext4", size: "1G" }
  - { mount: "swap", fs: "swap", size: "32G" }
  - { mount: "/", fs: "ext4", size: "all" }

# ----------------------------------------------------------------------------
# Hostname & bootloader
# ----------------------------------------------------------------------------
installimage_hostname: "{{ inventory_hostname_short | default(inventory_hostname) }}"
installimage_bootloader: grub

# Path the rendered installimage config is written to in the rescue, then passed
# to `installimage -c`.  It MUST NOT be /autosetup: installimage's `-c` handler
# copies the file to /autosetup itself (get_options.sh), so pointing -c at
# /autosetup makes it `cp /autosetup /autosetup` → "are the same file" → the
# installer cancels.  Any other path is fine.
hetzner_bootstrap_installimage_config_path: "/root/installimage.conf"

# ----------------------------------------------------------------------------
# Optional: a post-install script that installimage runs after the new system
# is laid down (chrooted into the installed root).  Absolute path on the
# rescue filesystem.  Leave undefined to skip.
# ----------------------------------------------------------------------------
# installimage_post_install_script: /tmp/post-install.sh

# ----------------------------------------------------------------------------
# Behavior flags
# ----------------------------------------------------------------------------
# If true, run installimage even when the host appears to already be
# installed (i.e., responds on SSH with a non-rescue kernel).  Use only when
# intentionally wiping a server.
hetzner_bootstrap_force_reinstall: false

# Reset type sent to the Robot API to reboot into rescue.
# Options: "hardware" (recommended), "power", "manual", "software".
hetzner_bootstrap_reset_type: hardware

# ----------------------------------------------------------------------------
# Timeouts (seconds)
# ----------------------------------------------------------------------------
hetzner_bootstrap_rescue_wait_seconds: 600
hetzner_bootstrap_installimage_timeout_seconds: 1800
hetzner_bootstrap_installed_wait_seconds: 600
